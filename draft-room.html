<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#10141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draft Room">
<title>Draft Room</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{
  --ink:#10141B; --panel:#191F29; --raised:#222A36; --line:#2E3846;
  --text:#E9EDF3; --muted:#8996A8; --dim:#5A6678;
  --amber:#FFB020; --amber-dim:#8A6218;
  --QB:#FF6B6B; --RB:#3DD68C; --WR:#4DA3FF; --TE:#C77DFF; --K:#FFD23F; --DEF:#7C8CA3;
  --num: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans: ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b: env(safe-area-inset-bottom,0px);
  --safe-t: env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.35;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
.eyebrow{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:700
}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
#clock{
  flex:0 0 auto;padding:calc(var(--safe-t) + 8px) 12px 8px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
#clockRow{display:flex;align-items:center;gap:10px}
#pickNo{
  font-family:var(--num);font-size:12px;font-weight:700;color:var(--amber);
  background:rgba(255,176,32,.12);border:1px solid var(--amber-dim);
  padding:5px 8px;border-radius:6px;white-space:nowrap;letter-spacing:.02em;
}
#onClock{flex:1;min-width:0}
#onClockName{
  font-size:16px;font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#onClockName.me{color:var(--amber)}
#needs{font-size:11px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#undo{
  font-size:12px;font-weight:700;color:var(--muted);
  border:1px solid var(--line);padding:7px 11px;border-radius:6px;
  background:var(--raised);white-space:nowrap
}
#undo:disabled{opacity:.35}

#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#tabs{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b)
}
#tabs button{
  padding:10px 2px 11px;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  border-top:2px solid transparent;margin-top:-1px
}
#tabs button.on{color:var(--amber);border-top-color:var(--amber)}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:20;background:var(--ink);
  border-bottom:1px solid var(--line);padding:9px 12px 10px
}
.srcRow{display:flex;gap:5px;margin-bottom:8px}
.srcRow button{
  flex:1;padding:8px 2px;font-size:11px;font-weight:700;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  letter-spacing:.03em;
}
.srcRow button.on{background:var(--amber);border-color:var(--amber);color:#10141B}
.posRow{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.posRow::-webkit-scrollbar{display:none}
.posRow button{
  flex:0 0 auto;padding:6px 11px;font-size:11px;font-weight:800;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);letter-spacing:.05em
}
.posRow button.on{color:#10141B;background:var(--text);border-color:var(--text)}
.posRow button.on[data-p=QB]{background:var(--QB);border-color:var(--QB)}
.posRow button.on[data-p=RB]{background:var(--RB);border-color:var(--RB)}
.posRow button.on[data-p=WR]{background:var(--WR);border-color:var(--WR)}
.posRow button.on[data-p=TE]{background:var(--TE);border-color:var(--TE)}
.posRow button.on[data-p=K]{background:var(--K);border-color:var(--K)}
.posRow button.on[data-p=DEF]{background:var(--DEF);border-color:var(--DEF)}
.findRow{display:flex;gap:6px;align-items:center}
.findRow input{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-size:14px;min-width:0
}
.findRow input::placeholder{color:var(--dim)}
.toggle{
  flex:0 0 auto;padding:8px 11px;font-size:11px;font-weight:700;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap
}
.toggle.on{color:var(--amber);border-color:var(--amber-dim);background:rgba(255,176,32,.1)}

/* ---------- player rows ---------- */
.rows{padding-bottom:20px}
.row{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px solid rgba(46,56,70,.55);width:100%;text-align:left;
  min-height:56px
}
.row:active{background:var(--raised)}
.row.gone{opacity:.3}
.row.gone .nm{text-decoration:line-through;text-decoration-color:var(--dim)}
.rk{
  font-family:var(--num);font-size:15px;font-weight:700;width:34px;
  flex:0 0 34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums
}
.pos{
  flex:0 0 34px;font-size:10px;font-weight:800;letter-spacing:.06em;
  text-align:center;padding:3px 0;border-radius:4px;color:#10141B
}
.pos.QB{background:var(--QB)} .pos.RB{background:var(--RB)}
.pos.WR{background:var(--WR)} .pos.TE{background:var(--TE)}
.pos.K{background:var(--K)}   .pos.DEF{background:var(--DEF)}
.mid{flex:1;min-width:0}
.nm{font-size:15px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--dim);margin-top:1px;font-family:var(--num)}
.sub b{color:var(--muted);font-weight:600}

/* divergence rail — the signature element */
.rail{flex:0 0 46px;height:30px;position:relative}
.rail i{
  position:absolute;width:3px;height:7px;border-radius:1px;
  left:50%;transform:translateX(-50%)
}
.rail .axis{
  position:absolute;left:0;right:0;top:50%;height:1px;
  background:var(--line);transform:translateY(-50%)
}
.rail .ctr{
  position:absolute;left:50%;top:3px;bottom:3px;width:1px;
  background:var(--dim);transform:translateX(-50%)
}

/* ---------- compare ---------- */
.cmp{width:100%;border-collapse:collapse}
.cmp th{
  position:sticky;top:0;background:var(--panel);z-index:5;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:9px 4px;border-bottom:1px solid var(--line);font-weight:700
}
.cmp td{padding:9px 4px;border-bottom:1px solid rgba(46,56,70,.5);font-size:13px}
.cmp .pn{padding-left:12px;font-weight:600}
.cmp .v{text-align:center;font-family:var(--num);width:44px;font-variant-numeric:tabular-nums}
.cmp tr.gone{opacity:.32}
.hi{color:var(--RB);font-weight:700}
.lo{color:var(--QB);font-weight:700}
.spread{text-align:center;width:46px;padding-right:12px;font-family:var(--num);
  font-weight:700;color:var(--amber)}

/* ---------- board ---------- */
#boardWrap{overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.bd{border-collapse:separate;border-spacing:0}
.bd th{
  position:sticky;top:0;z-index:6;background:var(--panel);
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:8px 4px;border-bottom:1px solid var(--line);font-weight:700;
  min-width:92px;max-width:92px
}
.bd th.me{color:var(--amber)}
.bd td.rd{
  position:sticky;left:0;z-index:5;background:var(--ink);
  font-family:var(--num);font-size:11px;color:var(--dim);font-weight:700;
  padding:0 8px;border-right:1px solid var(--line);text-align:center
}
.bd th.rdh{position:sticky;left:0;z-index:7;background:var(--panel);
  min-width:34px;max-width:34px;border-right:1px solid var(--line)}
.cell{
  min-width:92px;max-width:92px;height:44px;padding:4px 5px;
  border-bottom:1px solid rgba(46,56,70,.5);border-right:1px solid rgba(46,56,70,.35);
  vertical-align:middle;overflow:hidden
}
.cell .cn{font-size:11px;font-weight:600;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cp{font-size:9px;font-weight:800;letter-spacing:.05em;margin-top:2px}
.cell.next{background:rgba(255,176,32,.1);outline:1px solid var(--amber-dim);outline-offset:-1px}

/* ---------- teams ---------- */
.teamPick{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  padding:10px 12px;position:sticky;top:0;background:var(--ink);z-index:10;
  border-bottom:1px solid var(--line)}
.teamPick::-webkit-scrollbar{display:none}
.teamPick button{
  flex:0 0 auto;padding:7px 12px;font-size:12px;font-weight:700;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap
}
.teamPick button.on{background:var(--amber);border-color:var(--amber);color:#10141B}
.slot{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-bottom:1px solid rgba(46,56,70,.5);min-height:52px}
.slotLbl{
  flex:0 0 46px;font-size:10px;font-weight:800;letter-spacing:.08em;
  color:var(--muted);text-align:center;padding:4px 0;
  border:1px solid var(--line);border-radius:4px
}
.slotEmpty{color:var(--dim);font-style:italic;font-size:13px}
.benchHead{padding:14px 12px 6px;border-top:1px solid var(--line);margin-top:6px}

/* ---------- setup ---------- */
.setup{padding:18px 16px 40px;max-width:520px;margin:0 auto}
.setup h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.setup p.lede{color:var(--muted);font-size:14px;margin:0 0 22px}
.fld{margin-bottom:18px}
.fld label{display:block;margin-bottom:7px}
.fld select,.fld input[type=text]{
  width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:11px 12px;font-size:15px
}
.nameList{display:flex;flex-direction:column;gap:7px}
.nameRow{display:flex;align-items:center;gap:9px}
.nameRow span{font-family:var(--num);font-size:12px;color:var(--dim);width:22px;flex:0 0 22px}
.nameRow input{flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:9px 10px;font-size:14px;min-width:0}
.nameRow input.me{border-color:var(--amber-dim);color:var(--amber)}
.btnMain{
  width:100%;background:var(--amber);color:#10141B;font-weight:800;font-size:15px;
  padding:14px;border-radius:8px;letter-spacing:.01em;margin-top:6px
}
.btnGhost{
  width:100%;border:1px solid var(--line);color:var(--muted);font-weight:700;
  font-size:13px;padding:12px;border-radius:8px;margin-top:10px
}
.warn{color:var(--QB)}
.danger{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.danger p{color:var(--muted);font-size:12px;margin:7px 0 13px}
.btnDanger{
  width:100%;background:rgba(255,107,107,.09);border:1px solid var(--QB);
  color:var(--QB);font-weight:800;font-size:15px;padding:14px;border-radius:8px
}
.btnDanger.armed{background:var(--QB);color:#10141B}

/* ---------- sheet ---------- */
#sheet{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(8,11,15,.72);align-items:flex-end
}
#sheet.open{display:flex}
#sheetCard{
  width:100%;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:20px 16px calc(20px + var(--safe-b));
  animation:up .16s ease-out
}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheetCard{animation:none}}
#sheetName{font-size:21px;font-weight:800;letter-spacing:-.02em}
#sheetMeta{color:var(--muted);font-size:13px;margin-top:3px}
#sheetRanks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0}
#sheetRanks div{background:var(--raised);border-radius:7px;padding:9px 4px;text-align:center}
#sheetRanks b{display:block;font-family:var(--num);font-size:17px;font-weight:700;margin-top:3px}
#sheetTo{font-size:13px;color:var(--muted);margin-bottom:12px}
#sheetTo b{color:var(--amber)}
.sheetBtns{display:flex;gap:9px}
.sheetBtns button{flex:1;padding:14px;border-radius:8px;font-weight:800;font-size:14px}
#sConfirm{background:var(--amber);color:#10141B}
#sCancel{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
#sUndraft{background:var(--raised);color:var(--QB);border:1px solid var(--line)}

.empty{padding:52px 24px;text-align:center;color:var(--dim);font-size:14px}
.done{padding:40px 20px;text-align:center}
.done b{display:block;font-size:19px;color:var(--amber);margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <div id="clock">
    <div id="clockRow">
      <div id="pickNo" class="mono">—</div>
      <div id="onClock">
        <div id="onClockName">Draft Room</div>
        <div id="needs"></div>
      </div>
      <button id="undo" disabled>Undo</button>
    </div>
  </div>
  <div id="main"></div>
  <nav id="tabs">
    <button data-v="players" class="on">Players</button>
    <button data-v="compare">Compare</button>
    <button data-v="board">Board</button>
    <button data-v="teams">Teams</button>
    <button data-v="setup">Setup</button>
  </nav>
</div>

<div id="sheet">
  <div id="sheetCard">
    <div id="sheetName"></div>
    <div id="sheetMeta"></div>
    <div id="sheetRanks"></div>
    <div id="sheetTo"></div>
    <div class="sheetBtns">
      <button id="sCancel">Cancel</button>
      <button id="sConfirm">Draft</button>
    </div>
  </div>
</div>

      if (hasWS){ try{ await window.storage.delete(KEY,false); }catch(e){} }
      if (hasLS){ try{ localStorage.removeItem(KEY); }catch(e){} }
    }
  };
})();

/* ============ state ============ */
const SLOTS = [
  {k:'QB', n:1, take:['QB']},
  {k:'RB', n:2, take:['RB']},
  {k:'WR', n:2, take:['WR']},
  {k:'TE', n:1, take:['TE']},
  {k:'FLEX', n:2, take:['RB','WR','TE']},
  {k:'DEF', n:1, take:['DEF']},
  {k:'K', n:1, take:['K']}
];
const STARTERS = SLOTS.reduce((a,s)=>a+s.n,0); // 10

let S = {
  ready:false, teams:12, rounds:16, me:0, names:[], picks:[]
};
let ui = {
  view:'players', src:'nffc', pos:'ALL', hideDrafted:true, q:'', team:0,
  cmpSort:'spread'
};

const byId = {};
PLAYERS.forEach(p => byId[p.id] = p);

function defaultNames(n, me){
  return Array.from({length:n}, (_,i) => i===me ? 'My Team' : 'Team ' + (i+1));
}
async function persist(){ await Store.save(S); }

/* ============ draft math ============ */
function teamAtPick(i){
  const r = Math.floor(i / S.teams), k = i % S.teams;
  return (r % 2 === 0) ? k : (S.teams - 1 - k);
}
const totalPicks = () => S.teams * S.rounds;
const curPick    = () => S.picks.length;
const draftOver  = () => curPick() >= totalPicks();
function pickLabel(i){
  return (Math.floor(i / S.teams) + 1) + '.' + String((i % S.teams) + 1).padStart(2,'0');
}
function rosterOf(t){
  const out = [];
  S.picks.forEach((pid,i) => { if (teamAtPick(i) === t) out.push({p:byId[pid], i}); });
  return out;
}
const draftedSet = () => new Set(S.picks);

/* fill starters greedily: dedicated slots first, then flex */
function slotRoster(t){
  const roster = rosterOf(t);
  const used = new Set();
  const filled = SLOTS.map(s => ({k:s.k, take:s.take, n:s.n, men:[]}));
  filled.forEach(slot => {
    if (slot.k === 'FLEX') return;
    for (const e of roster){
      if (slot.men.length >= slot.n) break;
      if (used.has(e.i)) continue;
      if (slot.take.includes(e.p.pos)){ slot.men.push(e); used.add(e.i); }
    }
  });
  const flex = filled.find(s => s.k === 'FLEX');
  for (const e of roster){
    if (flex.men.length >= flex.n) break;
    if (used.has(e.i)) continue;
    if (flex.take.includes(e.p.pos)){ flex.men.push(e); used.add(e.i); }
  }
  const bench = roster.filter(e => !used.has(e.i));
  return {filled, bench};
}
function needsOf(t){
  const {filled} = slotRoster(t);
  const gaps = [];
  filled.forEach(s => { const m = s.n - s.men.length; if (m > 0) gaps.push(m > 1 ? s.k+'×'+m : s.k); });
  return gaps;
}

/* ============ ranking helpers ============ */
const SRC = {
  nffc:{key:'nffc', label:'NFFC'},
  bb:  {key:'bb',   label:'Big Board'},
  espn:{key:'espn', label:'ESPN'},
  yahoo:{key:'yahoo',label:'Yahoo'},
  cons:{key:'cons', label:'Consensus'}
};
function rankVal(p, k){ const v = p[k]; return (v === null || v === undefined) ? null : v; }
function sortKey(p, k){ const v = rankVal(p,k); return v === null ? 9999 : v; }

function visiblePlayers(){
  const D = draftedSet();
  let list = PLAYERS.filter(p => {
    if (ui.hideDrafted && D.has(p.id)) return false;
    if (ui.pos === 'FLEX'){ if (!['RB','WR','TE'].includes(p.pos)) return false; }
    else if (ui.pos !== 'ALL' && p.pos !== ui.pos) return false;
    if (ui.q){
      const q = ui.q.toLowerCase();
      if (!p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    }
    if (ui.src !== 'cons' && rankVal(p, ui.src) === null) return false;
    return true;
  });
  const k = ui.src;
  list.sort((a,b) => sortKey(a,k) - sortKey(b,k));
  return list;
}

/* divergence: how each source sits vs consensus, clamped */
function railHTML(p){
  const cols = {nffc:'var(--amber)', bb:'var(--text)', espn:'var(--WR)', yahoo:'var(--TE)'};
  const tops = {nffc:2, bb:9, espn:16, yahoo:23};
  let h = '<span class="axis"></span><span class="ctr"></span>';
  for (const k of ['nffc','bb','espn','yahoo']){
    const v = rankVal(p,k);
    if (v === null) continue;
    const d = Math.max(-1, Math.min(1, (v - p.cons) / 26));
    const x = 50 + d * 46;
    h += '<i style="left:'+x.toFixed(1)+'%;top:'+tops[k]+'px;background:'+cols[k]+'"></i>';
  }
  return h;
}

/* ============ render ============ */
const main = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderClock(){
  const pn = document.getElementById('pickNo');
  const nm = document.getElementById('onClockName');
  const nd = document.getElementById('needs');
  document.getElementById('undo').disabled = S.picks.length === 0;
  if (!S.ready){ pn.textContent='—'; nm.textContent='Draft Room'; nm.classList.remove('me');
    nd.textContent='Set up your league to start'; return; }
  if (draftOver()){ pn.textContent='DONE'; nm.textContent='Draft complete';
    nm.classList.remove('me'); nd.textContent = totalPicks()+' picks made'; return; }
  const i = curPick(), t = teamAtPick(i);
  pn.textContent = pickLabel(i);
  nm.textContent = S.names[t];
  nm.classList.toggle('me', t === S.me);
  const g = needsOf(t);
  nd.textContent = g.length ? 'Still needs ' + g.join(', ') : 'Starters full — bench';
}

function controlsHTML(withSrc){
  const srcBtns = ['nffc','bb','espn','yahoo','cons'].map(k =>
    '<button data-src="'+k+'" class="'+(ui.src===k?'on':'')+'">'+
    (k==='bb'?'BIG':k==='cons'?'AVG':SRC[k].label.toUpperCase())+'</button>').join('');
  const posBtns = ['ALL','QB','RB','WR','TE','FLEX','K','DEF'].map(p =>
    '<button data-pos="'+p+'" data-p="'+p+'" class="'+(ui.pos===p?'on':'')+'">'+p+'</button>').join('');
  return '<div class="controls">'+
    (withSrc ? '<div class="srcRow">'+srcBtns+'</div>' : '')+
    '<div class="posRow">'+posBtns+'</div>'+
    '<div class="findRow">'+
      '<input id="q" type="text" placeholder="Find a player" value="'+esc(ui.q)+'" autocomplete="off" autocorrect="off" spellcheck="false">'+
      '<button class="toggle '+(ui.hideDrafted?'on':'')+'" id="tgl">'+
        (ui.hideDrafted?'Hiding taken':'Showing taken')+'</button>'+
    '</div></div>';
}

function viewPlayers(){
  const list = visiblePlayers();
  const D = draftedSet();
  let h = controlsHTML(true) + '<div class="rows">';
  if (!list.length){
    h += (ui.src === 'bb' && (ui.pos === 'K' || ui.pos === 'DEF'))
      ? '<div class="empty">The Big Board has no kickers or defenses on it.<br>Switch to NFFC, ESPN, Yahoo or AVG to fill this slot.</div>'
      : '<div class="empty">No players match these filters.</div>';
  }
  for (const p of list){
    const gone = D.has(p.id);
    const r = rankVal(p, ui.src);
    const others = ['nffc','bb','espn','yahoo'].filter(k => k !== ui.src)
      .map(k => { const v = rankVal(p,k); return v===null?null:(SRC[k].label.split(' ')[0].slice(0,4)+' <b>'+v+'</b>'); })
      .filter(Boolean).join('  ');
    h += '<button class="row'+(gone?' gone':'')+'" data-id="'+p.id+'">'+
      '<span class="rk">'+(r===null?'–':r)+'</span>'+
      '<span class="pos '+p.pos+'">'+p.pos+'</span>'+
      '<span class="mid"><span class="nm">'+esc(p.name)+'</span>'+
      '<span class="sub">'+esc(p.team)+'  ·  '+others+'</span></span>'+
      '<span class="rail">'+railHTML(p)+'</span></button>';
  }
  main.innerHTML = h + '</div>';
}

function viewCompare(){
  const D = draftedSet();
  let list = PLAYERS.filter(p => {
    if (ui.hideDrafted && D.has(p.id)) return false;
    if (ui.pos === 'FLEX'){ if (!['RB','WR','TE'].includes(p.pos)) return false; }
    else if (ui.pos !== 'ALL' && p.pos !== ui.pos) return false;
    if (ui.q && !p.name.toLowerCase().includes(ui.q.toLowerCase())) return false;
    const n = ['nffc','bb','espn','yahoo'].filter(k => rankVal(p,k) !== null).length;
    return n >= 2;
  });
  // past the last pick a player is simply off the board, not "ranked 465" —
  // cap deep ranks so spread measures disagreement, not list length
  const reach = Math.max(200, totalPicks() + 30);
  list.forEach(p => {
    const raw = ['nffc','bb','espn','yahoo'].map(k => rankVal(p,k)).filter(v => v !== null);
    const vs = raw.map(v => Math.min(v, reach));
    p._spread = Math.max(...vs) - Math.min(...vs);
    p._min = Math.min(...vs); p._max = Math.max(...vs);
  });
  list = list.filter(p => p._min <= reach);
  list.sort((a,b) => ui.cmpSort === 'spread' ? b._spread - a._spread : a.cons - b.cons);

  let h = controlsHTML(false)+
    '<div style="padding:11px 12px 9px;display:flex;gap:6px;align-items:center">'+
      '<span class="eyebrow" style="flex:1">Sort</span>'+
      '<button class="toggle '+(ui.cmpSort==='spread'?'on':'')+'" data-cs="spread">Most disagreement</button>'+
      '<button class="toggle '+(ui.cmpSort==='cons'?'on':'')+'" data-cs="cons">Overall</button>'+
    '</div>'+
    '<table class="cmp"><thead><tr>'+
    '<th style="text-align:left;padding-left:12px">Player</th>'+
    '<th>NFFC</th><th>Big</th><th>ESPN</th><th>Yhoo</th><th style="padding-right:12px">Gap</th>'+
    '</tr></thead><tbody>';
  if (!list.length) h += '<tr><td colspan="6"><div class="empty">Nothing to compare here.</div></td></tr>';
  for (const p of list.slice(0,260)){
    const cell = k => {
      const v = rankVal(p,k);
      if (v === null) return '<td class="v" style="color:var(--dim)">–</td>';
      const c = (v === p._min && p._spread > 6) ? ' hi' : (v === p._max && p._spread > 6) ? ' lo' : '';
      return '<td class="v'+c+'">'+v+'</td>';
    };
    h += '<tr class="'+(D.has(p.id)?'gone':'')+'">'+
      '<td class="pn"><span style="color:var(--'+p.pos+');font-weight:800;font-size:10px">'+p.pos+'</span> '+esc(p.name)+'</td>'+
      cell('nffc')+cell('bb')+cell('espn')+cell('yahoo')+
      '<td class="spread">'+p._spread+'</td></tr>';
  }
  main.innerHTML = h + '</tbody></table><div style="height:24px"></div>';
}

function viewBoard(){
  if (!S.ready){ main.innerHTML = '<div class="empty">Set up your league first.</div>'; return; }
  const cur = curPick();
  let h = '<div id="boardWrap"><table class="bd"><thead><tr><th class="rdh">RD</th>';
  for (let t = 0; t < S.teams; t++)
    h += '<th class="'+(t===S.me?'me':'')+'">'+esc(S.names[t])+'</th>';
  h += '</tr></thead><tbody>';
  for (let r = 0; r < S.rounds; r++){
    h += '<tr><td class="rd">'+(r+1)+'</td>';
    for (let col = 0; col < S.teams; col++){
      const idx = (r % 2 === 0) ? r*S.teams + col : r*S.teams + (S.teams - 1 - col);
      const pid = S.picks[idx];
      const isNext = idx === cur;
      let inner = '';
      if (pid){
        const p = byId[pid];
        inner = '<div class="cn">'+esc(p.name)+'</div>'+
                '<div class="cp" style="color:var(--'+p.pos+')">'+p.pos+' · '+esc(p.team)+'</div>';
      } else if (isNext){
        inner = '<div class="cn" style="color:var(--amber)">On the clock</div>'+
                '<div class="cp" style="color:var(--amber-dim)">'+pickLabel(idx)+'</div>';
      } else {
        inner = '<div class="cp" style="color:var(--dim)">'+pickLabel(idx)+'</div>';
      }
      h += '<td class="cell'+(isNext?' next':'')+'">'+inner+'</td>';
    }
    h += '</tr>';
  }
  main.innerHTML = h + '</tbody></table></div>';
  if (cur > 0){
    const el = main.querySelector('.cell.next');
    if (el) el.scrollIntoView({block:'center', inline:'center'});
  }
}

function viewTeams(){
  if (!S.ready){ main.innerHTML = '<div class="empty">Set up your league first.</div>'; return; }
  const t = Math.min(ui.team, S.teams - 1);
  let h = '<div class="teamPick">';
  for (let i = 0; i < S.teams; i++)
    h += '<button data-team="'+i+'" class="'+(i===t?'on':'')+'">'+esc(S.names[i])+'</button>';
  h += '</div>';
  const {filled, bench} = slotRoster(t);
  const gaps = needsOf(t);
  h += '<div style="padding:13px 12px 4px" class="eyebrow">Starters — '+
       (STARTERS - gaps.reduce((a,g)=>a+(g.includes('×')?parseInt(g.split('×')[1]):1),0))+
       ' of '+STARTERS+' filled</div>';
  filled.forEach(s => {
    for (let n = 0; n < s.n; n++){
      const e = s.men[n];
      h += '<div class="slot"><span class="slotLbl">'+s.k+'</span>';
      if (e){
        h += '<span class="mid"><span class="nm">'+esc(e.p.name)+'</span>'+
             '<span class="sub" style="color:var(--'+e.p.pos+')">'+e.p.pos+' · '+esc(e.p.team)+
             '  <span style="color:var(--dim)">'+pickLabel(e.i)+'</span></span></span>';
      } else {
        h += '<span class="slotEmpty">Open</span>';
      }
      h += '</div>';
    }
  });
  h += '<div class="benchHead eyebrow">Bench — '+bench.length+'</div>';
  if (!bench.length) h += '<div class="slot"><span class="slotEmpty">Nobody on the bench yet</span></div>';
  bench.forEach(e => {
    h += '<div class="slot"><span class="slotLbl" style="color:var(--dim)">BN</span>'+
         '<span class="mid"><span class="nm">'+esc(e.p.name)+'</span>'+
         '<span class="sub" style="color:var(--'+e.p.pos+')">'+e.p.pos+' · '+esc(e.p.team)+
         '  <span style="color:var(--dim)">'+pickLabel(e.i)+'</span></span></span></div>';
  });
  main.innerHTML = h + '<div style="height:30px"></div>';
}

function viewSetup(){
  const n = S.teams;
  let names = '';
  for (let i = 0; i < n; i++){
    names += '<div class="nameRow"><span>'+(i+1)+'</span>'+
      '<input type="text" data-nm="'+i+'" class="'+(i===S.me?'me':'')+'" value="'+
      esc(S.names[i] || ('Team '+(i+1)))+'" maxlength="18"></div>';
  }
  const opt = (v,cur) => '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+v+'</option>';
  let teamOpts = '', roundOpts = '', meOpts = '';
  for (let i = 4; i <= 16; i++) teamOpts += opt(i, S.teams);
  for (let i = 10; i <= 25; i++) roundOpts += opt(i, S.rounds);
  for (let i = 0; i < n; i++)
    meOpts += '<option value="'+i+'"'+(i===S.me?' selected':'')+'>Pick '+(i+1)+' — '+esc(S.names[i])+'</option>';

  main.innerHTML = '<div class="setup">'+
    '<h1>League setup</h1>'+
    '<p class="lede">Roster is locked to 1 QB, 2 RB, 2 WR, 1 TE, 2 FLEX, 1 DEF, 1 K.</p>'+
    '<div class="fld"><label class="eyebrow">Teams</label><select id="setTeams">'+teamOpts+'</select></div>'+
    '<div class="fld"><label class="eyebrow">Rounds</label><select id="setRounds">'+roundOpts+'</select></div>'+
    '<div class="fld"><label class="eyebrow">Your draft slot</label><select id="setMe">'+meOpts+'</select></div>'+
    '<div class="fld"><label class="eyebrow">Team names</label><div class="nameList">'+names+'</div></div>'+
    '<button class="btnMain" id="startBtn">'+(S.picks.length?'Save changes':'Start draft')+'</button>'+
    (S.picks.length ? '<p class="lede warn" style="margin-top:14px;font-size:12px">'+
      S.picks.length+' picks recorded. Changing team count will re-shuffle who owns them.</p>' : '')+
    '<div class="danger">'+
      '<span class="eyebrow">Reset draft</span>'+
      '<p>Erases all '+S.picks.length+' picks. Teams, names, and your draft slot stay as they are. Takes two taps.</p>'+
      '<button class="btnDanger" id="resetBtn">Reset draft</button>'+
    '</div>'+
    '</div>';
}

function render(){
  renderClock();
  const v = ui.view;
  if (v === 'players') viewPlayers();
  else if (v === 'compare') viewCompare();
  else if (v === 'board') viewBoard();
  else if (v === 'teams') viewTeams();
  else viewSetup();
  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.v === v));
}

/* ============ sheet ============ */
let sheetId = null;
function openSheet(id){
  const p = byId[id];
  if (!p) return;
  const D = draftedSet();
  const taken = D.has(id);
  sheetId = id;
  document.getElementById('sheetName').textContent = p.name;
  document.getElementById('sheetMeta').innerHTML =
    '<span style="color:var(--'+p.pos+');font-weight:800">'+p.pos+'</span> · '+esc(p.team);
  document.getElementById('sheetRanks').innerHTML =
    ['nffc','bb','espn','yahoo'].map(k => {
      const v = rankVal(p,k);
      return '<div><span class="eyebrow">'+(k==='bb'?'BIG BOARD':SRC[k].label)+'</span>'+
             '<b>'+(v===null?'–':v)+'</b></div>';
    }).join('');
  const to = document.getElementById('sheetTo');
  const cf = document.getElementById('sConfirm');
  const btns = document.querySelector('.sheetBtns');
  const old = document.getElementById('sUndraft');
  if (old) old.remove();

  if (taken){
    const at = S.picks.indexOf(id);
    to.innerHTML = 'Taken at <b>'+pickLabel(at)+'</b> by <b>'+esc(S.names[teamAtPick(at)])+'</b>';
    cf.style.display = 'none';
    const u = document.createElement('button');
    u.id = 'sUndraft'; u.textContent = 'Put back';
    u.onclick = () => { undraft(id); closeSheet(); };
    btns.appendChild(u);
  } else if (!S.ready){
    to.innerHTML = '<span class="warn">Set up your league before drafting.</span>';
    cf.style.display = 'none';
  } else if (draftOver()){
    to.innerHTML = '<span class="warn">All picks are in.</span>';
    cf.style.display = 'none';
  } else {
    const t = teamAtPick(curPick());
    to.innerHTML = 'Pick <b>'+pickLabel(curPick())+'</b> to <b>'+esc(S.names[t])+'</b>';
    cf.style.display = '';
    cf.textContent = 'Draft';
  }
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); sheetId = null; }

async function draftPlayer(id){
  if (!S.ready || draftOver() || S.picks.includes(id)) return;
  S.picks.push(id);
  await persist(); render();
}
async function undraft(id){
  const i = S.picks.indexOf(id);
  if (i < 0) return;
  S.picks.splice(i,1);
  await persist(); render();
}

/* ============ events ============ */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  ui.view = b.dataset.v;
  main.scrollTop = 0;
  render();
});

document.getElementById('undo').addEventListener('click', async () => {
  if (!S.picks.length) return;
  S.picks.pop();
  await persist(); render();
});

main.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row){ openSheet(+row.dataset.id); return; }

  const src = e.target.closest('[data-src]');
  if (src){ ui.src = src.dataset.src; render(); return; }

  const pos = e.target.closest('[data-pos]');
  if (pos){ ui.pos = pos.dataset.pos; main.scrollTop = 0; render(); return; }

  const cs = e.target.closest('[data-cs]');
  if (cs){ ui.cmpSort = cs.dataset.cs; main.scrollTop = 0; render(); return; }

  if (e.target.closest('#tgl')){ ui.hideDrafted = !ui.hideDrafted; render(); return; }

  const tm = e.target.closest('[data-team]');
  if (tm){ ui.team = +tm.dataset.team; render(); return; }

  if (e.target.closest('#startBtn')){ saveSetup(); return; }
  if (e.target.closest('#resetBtn')){ doReset(); return; }
});

main.addEventListener('input', e => {
  if (e.target.id === 'q'){
    ui.q = e.target.value;
    const at = e.target.selectionStart;
    render();
    const nq = document.getElementById('q');
    if (nq){ nq.focus(); try{ nq.setSelectionRange(at,at); }catch(_){} }
  }
});

main.addEventListener('change', async e => {
  if (e.target.id === 'setTeams'){
    const n = +e.target.value;
    const old = S.names.slice();
    S.teams = n;
    S.names = defaultNames(n, Math.min(S.me, n-1));
    for (let i = 0; i < Math.min(old.length, n); i++) S.names[i] = old[i];
    S.me = Math.min(S.me, n-1);
    render();
  } else if (e.target.id === 'setRounds'){ S.rounds = +e.target.value; render(); }
  else if (e.target.id === 'setMe'){ S.me = +e.target.value; render(); }
});

async function saveSetup(){
  document.querySelectorAll('[data-nm]').forEach(inp => {
    const i = +inp.dataset.nm;
    S.names[i] = inp.value.trim() || ('Team ' + (i+1));
  });
  S.ready = true;
  await persist();
  ui.view = 'players';
  main.scrollTop = 0;
  render();
}

async function doReset(){
  const btn = document.getElementById('resetBtn');
  if (btn.dataset.armed !== '1'){
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    btn.textContent = 'Tap again to erase every pick';
    setTimeout(() => {
      const b = document.getElementById('resetBtn');
      if (b && b.dataset.armed === '1'){
        b.dataset.armed = '0';
        b.classList.remove('armed');
        b.textContent = 'Reset draft';
      }
    }, 4000);
    return;
  }
  S.picks = [];
  await persist(); render();
}

document.getElementById('sCancel').onclick = closeSheet;
document.getElementById('sConfirm').onclick = async () => {
  if (sheetId != null) await draftPlayer(sheetId);
  closeSheet();
};
document.getElementById('sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet') closeSheet();
});

/* ============ boot ============ */
(async () => {
  // browsers evict localStorage for ordinary sites under storage pressure;
  // a granted persist() exempts this origin from that eviction
  if (navigator.storage && navigator.storage.persist){
    try{ if (!(await navigator.storage.persisted())) await navigator.storage.persist(); }
    catch(e){}
  }
  if ('serviceWorker' in navigator && location.protocol !== 'file:'){
    try{ await navigator.serviceWorker.register('/sw.js'); }catch(e){}
  }

  const saved = await Store.load();
  if (saved && typeof saved === 'object'){
    S = Object.assign(S, saved);
    if (!Array.isArray(S.names) || S.names.length !== S.teams)
      S.names = defaultNames(S.teams, S.me);
    if (!Array.isArray(S.picks)) S.picks = [];
  } else {
    S.names = defaultNames(S.teams, S.me);
  }
  ui.view = S.ready ? 'players' : 'setup';
  render();
})();
</script>
</body>
</html>
